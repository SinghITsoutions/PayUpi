# ==========================
# Server
# ==========================
server:
  port: 8080

# ==========================
# Application
# ==========================
spring:
  application:
    name: api-gateway

  # ==========================
  # Gateway MVC Routes
  # ==========================
  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # User Service
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**,/users/**

            # Bank Service
            - id: bank-service
              uri: http://localhost:8082
              predicates:
                - Path=/bank/**

            # Notification Service
            - id: notification-service
              uri: http://localhost:8083
              predicates:
                - Path=/notifications/**

            # Transaction Service
            - id: transaction-service
              uri: http://localhost:8084
              predicates:
                - Path=/transactions/**

# ==========================
# JWT
# ==========================
jwt:
  secret: ${JWT_SECRET}