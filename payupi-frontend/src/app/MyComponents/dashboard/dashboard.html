<!-- Fixed top search bar with rotating placeholder + user icon -->
<div class="topbar">
  <button class="search-bar" type="button">
    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span class="search-placeholder">{{ currentPlaceholder }}</span>
  </button>

  <button class="user-icon" type="button" (click)="goToUserDetails()" aria-label="View user details">
    {{ currentUser.initial }}
  </button>
</div>

    <button class="add-bank-btn" type="button" (click)="goToAddBankAccount()">

    </button>

</section>

  <!-- Quick actions row -->
  <section class="quick-actions">
    <button class="action-item" type="button" (click)="onScanQrCode()">
      <span class="action-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <line x1="14" y1="14" x2="14" y2="21"></line>
          <line x1="21" y1="14" x2="21" y2="21"></line>
          <line x1="17" y1="17" x2="21" y2="17"></line>
        </svg>
      </span>
      <span class="action-label">Scan any QR code</span>
    </button>

    <button class="action-item" type="button" (click)="onPayAnyone()">
      <span class="action-icon">
       <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- bracket / open-sided box -->
    <path d="M16 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h10"></path>
    <!-- rupee symbol -->
    <path d="M8.5 8h5"></path>
    <path d="M8.5 10.5h5"></path>
    <path d="M8.5 8c2.5 0 4 1.2 4 2.8s-1.5 2.7-4 2.7"></path>
    <path d="M8.5 13.5l4.5 4.5"></path>
    <!-- upward arrow, overlapping the open right edge -->
    <path d="M17 14V5"></path>
    <path d="M14.2 7.8L17 5l2.8 2.8"></path>
  </svg>
</span>
<span class="action-label">Pay anyone</span>

    </button>


    

    <button class="action-item" type="button" (click)="onBankTransfer()">
      <span class="action-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 10l9-6 9 6"></path>
          <path d="M5 10v9h14v-9"></path>
          <line x1="9" y1="14" x2="9" y2="19"></line>
          <line x1="15" y1="14" x2="15" y2="19"></line>
        </svg>
      </span>
      <span class="action-label">Bank transfer</span>
    </button>

    <button class="action-item" type="button" (click)="onMobileRecharge()">
      <span class="action-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="7" y="2" width="10" height="20" rx="2"></rect>
          <line x1="11" y1="18" x2="13" y2="18"></line>
        </svg>
      </span>
      <span class="action-label">Mobile recharge</span>
    </button>
  </section>

  <!-- People -->
  <section class="section-block">
    <h2 class="section-title">People</h2>

        <span class="people-icon">💸</span>
        <span class="people-label">Pocket money</span>
      </button>
    </div>
  </section>

  <!-- Bills & recharges -->

        <p class="section-subtitle">Get reminders and pay on time</p>
      </div>
      <button class="manage-link" type="button">

          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="grid-4">
      <button class="grid-item" type="button">
        <span class="grid-icon">📱</span>
        <span class="grid-label">Mobile recharge</span>
      </button>

        <span class="grid-icon">📺</span>
        <span class="grid-label">DTH / Cable TV</span>
      </button>

        <span class="grid-icon">💡</span>
        <span class="grid-label">Electricity</span>

      </button>
      <button class="grid-item" type="button">
        <span class="grid-icon">💳</span>
        <span class="grid-label">Credit cards</span>
      </button>
    </div>
  </section>

  <!-- Businesses -->
  <section class="section-block">
    <div class="section-header">
      <h2 class="section-title">Businesses</h2>
      <button class="manage-link" type="button">
        Explore
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="grid-4">
      <button class="grid-item" type="button">
        <span class="grid-icon round red">🚌</span>
        <span class="grid-label">AbhiBus</span>
      </button>
      <button class="grid-item" type="button">
        <span class="grid-icon round">🤝</span>
        <span class="grid-label">InstaMoney</span>
      </button>
      <button class="grid-item" type="button">
        <span class="grid-icon round green">🚆</span>
        <span class="grid-label">ConfirmTkt</span>
      </button>
      <button class="grid-item" type="button">
        <span class="grid-icon round dark">P</span>
        <span class="grid-label">PayMe</span>
      </button>
    </div>
  </section>

  <!-- Gift cards & more -->
  <section class="section-block">
    <h2 class="section-title">Gift cards &amp; more</h2>
    <div class="cards-row">
      <button class="info-card" type="button">
        <span class="info-card-icon">🎬</span>
        <span class="info-card-title">Subscriptions</span>
        <span class="info-card-subtitle">Buy plans from leading OTT platforms</span>

        <span class="info-card-title">Gift cards</span>
        <span class="info-card-subtitle">Buy gift cards from the biggest brands</span>
      </button>
    </div>
  </section>

  <!-- Offers & rewards -->
  <section class="section-block">
    <h2 class="section-title">Offers &amp; rewards</h2>
    <div class="grid-4">
      <button class="grid-item" type="button">
        <span class="grid-icon">🏅</span>
        <span class="grid-label">Rewards</span>
      </button>
      <button class="grid-item" type="button">
        <span class="grid-icon">🏷️</span>

      </button>
      <button class="grid-item" type="button">
        <span class="grid-icon">🔁</span>

      <span class="cibil-cta">Check now</span>
    </div>
    <div class="cibil-art" aria-hidden="true">📊</div>
  </section>

  <!-- List links -->
  <section class="list-section">
    <button class="list-item" type="button">
      <span class="list-icon">📈</span>
      <span class="list-label">Check your CIBIL score for free</span>
      <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
    <button class="list-item" type="button">
      <span class="list-icon">🕘</span>
      <span class="list-label">See transaction history</span>
      <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
    <button class="list-item" type="button">
      <span class="list-icon">🏦</span>
      <span class="list-label">Check bank balance</span>
      <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </section>

  <!-- bottom spacer so content isn't hidden behind fixed nav -->
  <div class="bottom-spacer"></div>
</div>

<!-- Fixed bottom navigation bar -->
<nav class="bottom-nav">
  <button class="nav-item active" type="button" (click)="goToHome()">

      <path d="M3 11l9-8 9 8"></path>
      <path d="M5 10v10h14V10"></path>
    </svg>
    <span>Home</span>
  </button>

  <button class="nav-item" type="button" (click)="goToMoney()">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
