<!-- Main Content -->
<div class="welcome-container">

  <!-- Google Pay Logo (inline SVG coloured G) -->
  

<div class="logo-wrapper">
    <svg width="55" height="55" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
      <!-- Blue arc -->
      <path d="M22 8 A14 14 0 0 0 8 22" stroke="#4285F4" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <!-- Red arc -->
      <path d="M8 22 A14 14 0 0 0 22 36" stroke="#EA4335" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <!-- Yellow arc -->
      <path d="M22 36 A14 14 0 0 0 36 22" stroke="#FBBC05" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <!-- Green arc -->
      <path d="M36 22 A14 14 0 0 0 22 8" stroke="#34A853" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <!-- Center horizontal bar (the Pay "G" crossbar) -->
      <line x1="22" y1="22" x2="34" y2="22" stroke="#4285F4" stroke-width="5.5" stroke-linecap="round"/>
      
    </svg>

   
  </div>

  

  <!-- Heading -->
  <h1 class="welcome-title">Welcome to PayUpi</h1>
  <p class="welcome-subtitle">Enter your phone number</p>

  <!-- Phone Input Row -->
  <div class="phone-input-row">
    <!-- Country Code Box -->
    <div class="country-code-box">
      <!-- India Flag inline -->
      <svg width="24" height="16" viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg" style="border-radius:2px;border:0.5px solid #dadce0;flex-shrink:0;">
        <rect width="24" height="5.3"  y="0"    fill="#FF9933"/>
        <rect width="24" height="5.3"  y="5.35" fill="#FFFFFF"/>
        <rect width="24" height="5.3"  y="10.7" fill="#138808"/>
        <circle cx="12" cy="8" r="2.4" fill="none" stroke="#000080" stroke-width="0.45"/>
        <circle cx="12" cy="8" r="0.38" fill="#000080"/>
        <g stroke="#000080" stroke-width="0.32">
          <line x1="12" y1="5.6"  x2="12" y2="10.4"/>
          <line x1="9.6" y1="8"   x2="14.4" y2="8"/>
          <line x1="10.3" y1="6.3" x2="13.7" y2="9.7"/>
          <line x1="13.7" y1="6.3" x2="10.3" y2="9.7"/>
          <line x1="9.65" y1="6.85" x2="14.35" y2="9.15"/>
          <line x1="14.35" y1="6.85" x2="9.65" y2="9.15"/>
          <line x1="10.3" y1="9.85" x2="13.7" y2="6.15"/>
          <line x1="13.7" y1="9.85" x2="10.3" y2="6.15"/>
        </g>
      </svg>
      <span class="country-code">+91</span>
    </div>

    <!-- Phone Number Input -->
    <input
      type="tel"
      class="phone-input"
      placeholder="00000 00000"
      maxlength="10"
      [(ngModel)]="phoneNumber"
       (input)="onPhoneInput($event)"
    />
  </div>

  <!-- Suggested Numbers -->
  <div class="suggestions-row">
    <button class="suggestion-btn" (click)="selectPhone('9244170200')">
      <!-- Phone SVG icon -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
        <line x1="12" y1="18" x2="12.01" y2="18"/>
      </svg>
      +91 92441 70200
    </button>
    <button class="suggestion-btn" (click)="selectPhone('7974170858')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
        <line x1="12" y1="18" x2="12.01" y2="18"/>
      </svg>
      +91 79741 70858
    </button>
  </div>

  <!-- Error Message -->
  <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>

  <!-- Loading Spinner -->
  <div class="loading-spinner" *ngIf="isLoading">
    <div class="spinner"></div>
  </div>

</div>

<!-- Continue Button (fixed bottom) -->
<div class="bottom-bar">
  <button
    class="continue-btn"
    [disabled]="!isPhoneValid() || isLoading"
    [class.active]="isPhoneValid() && !isLoading"
    (click)="sendMobileNumber()"
   
    

  >
    {{ isLoading ? 'Please wait...' : 'Continue' }}
  </button>
</div>
